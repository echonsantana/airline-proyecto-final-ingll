<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrativo - Airline Reservations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .stat-card { transition: transform 0.2s; border: none; border-radius: 12px; }
    .stat-card:hover { transform: translateY(-2px); }
    .nav-tabs .nav-link.active { background: #007bff; color: white; }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">
      <i class="bi bi-airplane me-2"></i>Airline Reservations - Admin
    </a>
    <div class="d-flex align-items-center">
      <span class="text-light me-3" id="adminName"></span>
      <button class="btn btn-outline-light btn-sm" id="btnCerrarSesion">
        <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
      </button>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <!-- Tarjetas de estadísticas -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card stat-card shadow-sm">
        <div class="card-body text-center">
          <i class="bi bi-airplane fs-1 text-primary"></i>
          <h3 id="totalVuelos" class="mt-2">0</h3>
          <p class="text-muted">Vuelos</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card shadow-sm">
        <div class="card-body text-center">
          <i class="bi bi-calendar-check fs-1 text-success"></i>
          <h3 id="totalReservas" class="mt-2">0</h3>
          <p class="text-muted">Reservas</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card shadow-sm">
        <div class="card-body text-center">
          <i class="bi bi-people fs-1 text-info"></i>
          <h3 id="totalUsuarios" class="mt-2">0</h3>
          <p class="text-muted">Usuarios</p>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card shadow-sm">
        <div class="card-body text-center">
          <i class="bi bi-currency-dollar fs-1 text-warning"></i>
          <h3 id="totalGanancias" class="mt-2">$0</h3>
          <p class="text-muted">Ganancias</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Pestañas -->
  <div class="card shadow-sm">
    <div class="card-header bg-white">
      <ul class="nav nav-tabs card-header-tabs" id="adminTabs">
        <li class="nav-item">
          <button class="nav-link active" data-tab="vuelos">
            <i class="bi bi-airplane me-2"></i>Vuelos
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="reservas">
            <i class="bi bi-calendar-check me-2"></i>Reservas
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="usuarios">
            <i class="bi bi-people me-2"></i>Usuarios
          </button>
        </li>
      </ul>
    </div>
    <div class="card-body">
      <!-- Contenido Vuelos -->
      <div id="tabVuelos" class="tab-content active">
        <div class="d-flex justify-content-between mb-3">
          <button class="btn btn-primary" id="btnAgregarVuelo">
            <i class="bi bi-plus-circle me-2"></i>Agregar Vuelo
          </button>
          <div class="input-group w-50">
            <input type="text" class="form-control" id="buscarVuelo" placeholder="Buscar vuelo...">
            <button class="btn btn-outline-secondary" id="btnBuscarVuelo">Buscar</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead class="table-light">
              <tr><th>ID</th><th>Origen</th><th>Destino</th><th>Fecha</th><th>Precio</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaVuelos"></tbody>
          </table>
        </div>
      </div>

      <!-- Contenido Reservas -->
      <div id="tabReservas" class="tab-content" style="display:none">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead class="table-light">
              <tr><th>Código</th><th>Cliente</th><th>Vuelo</th><th>Asientos</th><th>Total</th><th>Estado</th></tr>
            </thead>
            <tbody id="tablaReservas"></tbody>
          </table>
        </div>
      </div>

      <!-- Contenido Usuarios -->
      <div id="tabUsuarios" class="tab-content" style="display:none">
        <div class="d-flex justify-content-between mb-3">
          <button class="btn btn-success" id="btnAgregarUsuario">
            <i class="bi bi-person-plus me-2"></i>Agregar Usuario
          </button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead class="table-light">
              <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Reservas</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tablaUsuarios"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Vuelo -->
<div class="modal fade" id="modalVuelo" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Vuelo</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formVuelo">
          <input type="hidden" id="vueloId">
          <div class="mb-3"><label>Origen</label><input type="text" class="form-control" name="origen" required></div>
          <div class="mb-3"><label>Destino</label><input type="text" class="form-control" name="destino" required></div>
          <div class="mb-3"><label>Fecha</label><input type="date" class="form-control" name="fecha" required></div>
          <div class="mb-3"><label>Precio</label><input type="number" class="form-control" name="precio" required></div>
          <button type="submit" class="btn btn-primary w-100">Guardar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Modal Usuario -->
<div class="modal fade" id="modalUsuario" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Usuario</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formUsuario">
          <input type="hidden" id="usuarioId">
          <div class="mb-3"><label>Nombre</label><input type="text" class="form-control" id="nombreUsuario" required></div>
          <div class="mb-3"><label>Email</label><input type="email" class="form-control" id="emailUsuario" required></div>
          <div class="mb-3"><label>Contraseña</label><input type="password" class="form-control" id="passwordUsuario" placeholder="Dejar en blanco para mantener"></div>
          <div class="mb-3"><label>Rol</label><select class="form-select" id="rolUsuario"><option value="usuario">Usuario</option><option value="admin">Administrador</option></select></div>
          <button type="submit" class="btn btn-success w-100">Guardar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/admin.js"></script>
<div id="toastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080;"></div>
</body>
</html>
