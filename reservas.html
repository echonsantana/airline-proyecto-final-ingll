<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand">Mis Reservas</span>
    <button class="btn btn-outline-light btn-sm" id="cerrarSesion">Inicio</button>
  </div>
</nav>

<div class="container mt-4" id="reservasContainer"></div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="miToast" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
import { supabaseService } from './src/services/supabaseService.js';
import { cancelarReserva, crearReserva } from './src/controladores.js';
import { supabase } from './src/services/supabaseClient.js';

function showToast(message, type = 'success') {
  const toastEl = document.getElementById('miToast');
  const toastBody = document.getElementById('toastBody');
  toastBody.textContent = message;
  toastEl.className = `toast align-items-center text-white bg-${type} border-0`;
  const toast = new bootstrap.Toast(toastEl);
  toast.show();
}

function getBadgeColor(estado) {
  const colores = {
    'pagada': 'success',
    'confirmada': 'success',
    'pendiente': 'warning',
    'cancelada': 'danger'
  };
  return colores[estado] || 'secondary';
}

async function cargarReservas() {
  const user = JSON.parse(sessionStorage.getItem('aero_user'));
  const container = document.getElementById('reservasContainer');

  if (!user) {
    container.innerHTML = '<div class="alert alert-warning">Debes iniciar sesión</div>';
    return;
  }

  // Obtener reservas de la base de datos (confirmadas)
  const reservasBD = await supabaseService.obtenerReservasByUser(user.id);
  console.log('📦 Reservas BD:', reservasBD);
  
  // Obtener reservas pendientes de Supabase
  let reservasPendientes = [];
  try {
    reservasPendientes = await supabaseService.obtenerReservasPendientesByUser(user.id);
    console.log('📦 Reservas pendientes desde Supabase:', reservasPendientes);
  } catch (error) {
    console.error('Error obteniendo reservas pendientes:', error);
  }

  // Si no hay reservas en BD ni pendientes
  if (reservasBD.length === 0 && reservasPendientes.length === 0) {
    container.innerHTML = '<div class="alert alert-info">No tienes reservas</div>';
    return;
  }

  let html = '';

  // ========== MOSTRAR TODAS LAS RESERVAS PENDIENTES ==========
  if (reservasPendientes.length > 0) {
    reservasPendientes.forEach(pendiente => {
      // Calcular tiempo restante para expiración
      const tiempoRestante = Math.max(0, new Date(pendiente.expira) - new Date());
      const minutosRestantes = Math.floor(tiempoRestante / 60000);
      const segundosRestantes = Math.floor((tiempoRestante % 60000) / 1000);
      
      html += `
        <div class="card mb-3 border-warning" data-pendiente-id="${pendiente.id}">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="text-warning">⏳ RESERVA PENDIENTE DE PAGO</h6>
                <small>Código: ${pendiente.codigo || pendiente.id.substring(0, 8)}</small><br>
                <small>Vuelo: ${pendiente.vuelo?.origen || 'N/A'} → ${pendiente.vuelo?.destino || 'N/A'}</small><br>
                <small>Asientos: ${pendiente.asientos?.join(', ') || 'N/A'}</small><br>
                <small class="fw-bold">Total: $${pendiente.total}</small>
                <br><small class="text-muted">⏰ Expira en: ${minutosRestantes}m ${segundosRestantes}s</small>
              </div>
              <div class="text-end">
                <span class="badge bg-warning mb-2">Pendiente</span>
                <div class="mt-2">
                  <button class="btn btn-sm btn-danger me-1 cancelar-pendiente-btn" data-id="${pendiente.id}">
                    <i class="bi bi-x-circle"></i> Cancelar
                  </button>
                  <button class="btn btn-sm btn-success pagar-pendiente-btn" 
                    data-id="${pendiente.id}"
                    data-clienteid="${pendiente.clienteId}"
                    data-vueloid="${pendiente.vueloId}"
                    data-asientos='${JSON.stringify(pendiente.asientos)}'
                    data-total="${pendiente.total}"
                    data-clase="${pendiente.clase}">
                    <i class="bi bi-credit-card"></i> Pagar
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    });
  }

  // ========== MOSTRAR RESERVAS DE LA BASE DE DATOS ==========
  if (reservasBD.length > 0) {
    reservasBD.forEach(r => {
      const estado = r.estado || 'confirmada';
      const puedePagar = estado !== 'pagada' && estado !== 'cancelada';
      const puedeCancelar = estado !== 'cancelada' && estado !== 'pagada';
      
      html += `
        <div class="card mb-3">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6>${r.codigo}</h6>
                <small>${r.vuelo?.origen || ''} → ${r.vuelo?.destino || ''}</small><br>
                <small>Asientos: ${r.asientos?.join(', ') || 'N/A'}</small><br>
                <small class="fw-bold">Total: $${r.total}</small>
                <br><small class="text-muted">Fecha: ${new Date(r.fecha).toLocaleDateString()}</small>
              </div>
              <div class="text-end">
                <span class="badge bg-${getBadgeColor(estado)} mb-2">${estado.toUpperCase()}</span>
                <div class="mt-2">
                  ${puedeCancelar ? `<button class="btn btn-sm btn-danger me-1 cancelar-btn" data-id="${r.id}"><i class="bi bi-x-circle"></i> Cancelar</button>` : ''}
                  ${puedePagar ? `<button class="btn btn-sm btn-success pagar-btn" data-id="${r.id}" data-monto="${r.total}"><i class="bi bi-credit-card"></i> Pagar</button>` : ''}
                  ${estado === 'pagada' ? '<span class="badge bg-success"><i class="bi bi-check-circle"></i> Pagado</span>' : ''}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    });
  }

  container.innerHTML = html;

  // ========== EVENTOS PARA CANCELAR RESERVAS PENDIENTES ==========
  document.querySelectorAll('.cancelar-pendiente-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const reservaId = btn.dataset.id;
      if (!reservaId) return;
      
      if (confirm('¿Cancelar esta reserva pendiente?')) {
        await supabaseService.eliminarReservaPendiente(reservaId);
        showToast('Reserva cancelada', 'warning');
        cargarReservas();
      }
    });
  });

  // ========== EVENTOS PARA PAGAR RESERVAS PENDIENTES ==========
  document.querySelectorAll('.pagar-pendiente-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const data = btn.dataset;
      
      try {
        showToast('Procesando pago...', 'info');
        
        // Crear la reserva en BD
        const resultado = await crearReserva({
          clienteId: data.clienteid,
          vueloId: data.vueloid,
          asientos: JSON.parse(data.asientos),
          total: parseFloat(data.total),
          clase: data.clase
        });
        
        if (!resultado?.ok || !resultado?.reserva?.id) {
          throw new Error('Error al crear la reserva');
        }
        
        const nuevaReservaId = resultado.reserva.id;
        
        // Registrar el pago
        const { error: pagoError } = await supabase
          .from('pagos')
          .insert([{
            reserva_id: nuevaReservaId,
            monto: parseFloat(data.total),
            metodo: 'tarjeta',
            estado: 'completado'
          }]);
        
        if (pagoError) throw pagoError;
        
        // Actualizar estado de la reserva
        const { error: reservaError } = await supabase
          .from('reservas')
          .update({ estado: 'pagada' })
          .eq('id', nuevaReservaId);
        
        if (reservaError) throw reservaError;
        
        // Eliminar reserva pendiente
        await supabaseService.eliminarReservaPendiente(data.id);
        
        showToast('✅ Reserva y pago completados', 'success');
        cargarReservas();
        
      } catch (error) {
        console.error('Error:', error);
        showToast('Error al procesar el pago: ' + error.message, 'danger');
      }
    });
  });

  // ========== EVENTOS PARA CANCELAR RESERVAS DE BD ==========
  document.querySelectorAll('.cancelar-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const id = btn.dataset.id;
      if (!id) return;
      
      if (confirm('¿Cancelar esta reserva?')) {
        const res = await cancelarReserva(id);
        if (res.ok) {
          showToast('Reserva cancelada', 'warning');
          cargarReservas();
        } else {
          showToast('Error al cancelar', 'danger');
        }
      }
    });
  });

  // ========== EVENTOS PARA PAGAR RESERVAS DE BD ==========
  document.querySelectorAll('.pagar-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const id = btn.dataset.id;
      const monto = parseFloat(btn.dataset.monto);
      
      if (!id) return;
      
      try {
        showToast('Procesando pago...', 'info');
        
        // Registrar pago
        const { error: pagoError } = await supabase
          .from('pagos')
          .insert([{
            reserva_id: id,
            monto: monto,
            metodo: 'tarjeta',
            estado: 'completado'
          }]);
        
        if (pagoError) throw pagoError;
        
        // Actualizar reserva
        const { error: reservaError } = await supabase
          .from('reservas')
          .update({ estado: 'pagada' })
          .eq('id', id);
        
        if (reservaError) throw reservaError;
        
        showToast('✅ Pago realizado', 'success');
        cargarReservas();
        
      } catch (error) {
        console.error('Error:', error);
        showToast('Error al pagar: ' + error.message, 'danger');
      }
    });
  });
}

// Cerrar sesión
document.getElementById('cerrarSesion').onclick = () => { 
  location.href = 'index.html';
};

// Inicializar
cargarReservas();
</script>
</body>
</html>
