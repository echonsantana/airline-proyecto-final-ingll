<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand">Mis Reservas</span>
    <button class="btn btn-outline-light btn-sm" id="cerrarSesion">Inicio</button>
  </div>
</nav>

<div class="container mt-4" id="reservasContainer"></div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="miToast" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
import { supabaseService } from './src/services/supabaseService.js';
import { cancelarReserva, crearReserva } from './src/controladores.js';
import { supabase } from './src/services/supabaseClient.js';

function showToast(message, type = 'success') {
  const toastEl = document.getElementById('miToast');
  const toastBody = document.getElementById('toastBody');
  toastBody.textContent = message;
  toastEl.className = `toast align-items-center text-white bg-${type} border-0`;
  const toast = new bootstrap.Toast(toastEl);
  toast.show();
}

function getBadgeColor(estado) {
  const colores = {
    'pagada': 'success',
    'confirmada': 'success',
    'pendiente': 'warning',
    'cancelada': 'danger'
  };
  return colores[estado] || 'secondary';
}

async function cargarReservas() {
  const user = JSON.parse(sessionStorage.getItem('aero_user'));
  const container = document.getElementById('reservasContainer');

  if (!user) {
    container.innerHTML = '<div class="alert alert-warning">Debes iniciar sesión</div>';
    return;
  }

  // Obtener reservas de la base de datos
  const reservasBD = await supabaseService.obtenerReservasByUser(user.id);
  console.log('📦 Reservas BD:', reservasBD);
  
  // Obtener reservas pendientes de Supabase
  let reservasPendientes = [];
  try {
    reservasPendientes = await supabaseService.obtenerReservasPendientesByUser(user.id);
    console.log('📦 Reservas pendientes desde Supabase:', reservasPendientes);
  } catch (error) {
    console.error('Error obteniendo reservas pendientes:', error);
  }
  
  let reservaPendiente = reservasPendientes.length > 0 ? reservasPendientes[0] : null;

  // Si no hay reservas en BD ni pendiente
  if (reservasBD.length === 0 && !reservaPendiente) {
    container.innerHTML = '<div class="alert alert-info">No tienes reservas</div>';
    return;
  }

  let html = '';

  // Mostrar reserva pendiente primero (si existe)
  if (reservaPendiente) {
    html += `
      <div class="card mb-3 border-warning">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-warning">⏳ RESERVA PENDIENTE DE PAGO</h6>
              <small>Código: ${reservaPendiente.codigo || 'Pendiente'}</small><br>
              <small>Vuelo ID: ${reservaPendiente.vueloId}</small><br>
              <small>Asientos: ${reservaPendiente.asientos?.join(', ') || 'N/A'}</small><br>
              <small class="fw-bold">Total: $${reservaPendiente.total}</small>
            </div>
            <div class="text-end">
              <span class="badge bg-warning mb-2">Pendiente</span>
              <div class="mt-2">
                <button class="btn btn-sm btn-danger me-1 cancelar-pendiente-btn">Cancelar</button>
                <button class="btn btn-sm btn-success pagar-pendiente-btn">Pagar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // Mostrar reservas de la base de datos
  if (reservasBD.length > 0) {
    reservasBD.forEach(r => {
      const estado = r.estado || 'confirmada';
      const puedePagar = estado !== 'pagada' && estado !== 'cancelada';
      const puedeCancelar = estado !== 'cancelada' && estado !== 'pagada';
      
      html += `
        <div class="card mb-3">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6>${r.codigo}</h6>
                <small>${r.vuelo?.origen || ''} → ${r.vuelo?.destino || ''}</small><br>
                <small>Asientos: ${r.asientos?.join(', ') || 'N/A'}</small><br>
                <small class="fw-bold">Total: $${r.total}</small>
              </div>
              <div class="text-end">
                <span class="badge bg-${getBadgeColor(estado)} mb-2">${estado.toUpperCase()}</span>
                <div class="mt-2">
                  ${puedeCancelar ? `<button class="btn btn-sm btn-danger me-1 cancelar-btn" data-id="${r.id}">Cancelar</button>` : ''}
                  ${puedePagar ? `<button class="btn btn-sm btn-success pagar-btn" data-id="${r.id}" data-monto="${r.total}">Pagar</button>` : ''}
                  ${estado === 'pagada' ? '<span class="badge bg-success">Pagado</span>' : ''}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    });
  }

  container.innerHTML = html;

  // Evento para cancelar reserva pendiente (Supabase)
  const cancelarPendienteBtn = document.querySelector('.cancelar-pendiente-btn');
  if (cancelarPendienteBtn && reservaPendiente) {
    cancelarPendienteBtn.addEventListener('click', async () => {
      await supabaseService.eliminarReservaPendiente(reservaPendiente.id);
      showToast('Reserva cancelada', 'warning');
      cargarReservas();
    });
  }

  // Evento para pagar reserva pendiente (Supabase)
  const pagarPendienteBtn = document.querySelector('.pagar-pendiente-btn');
  if (pagarPendienteBtn && reservaPendiente) {
    pagarPendienteBtn.addEventListener('click', async () => {
      try {
        showToast('Procesando pago...', 'info');
        
        const resultado = await crearReserva({
          clienteId: reservaPendiente.clienteId,
          vueloId: reservaPendiente.vueloId,
          asientos: reservaPendiente.asientos,
          total: reservaPendiente.total,
          clase: reservaPendiente.clase
        });
        
        if (!resultado?.ok || !resultado?.reserva?.id) {
          throw new Error('Error al crear la reserva');
        }
        
        const nuevaReservaId = resultado.reserva.id;
        
        const { error: pagoError } = await supabase
          .from('pagos')
          .insert([{
            reserva_id: nuevaReservaId,
            monto: reservaPendiente.total,
            metodo: 'tarjeta',
            estado: 'completado'
          }]);
        
        if (pagoError) throw pagoError;
        
        const { error: reservaError } = await supabase
          .from('reservas')
          .update({ estado: 'pagada' })
          .eq('id', nuevaReservaId);
        
        if (reservaError) throw reservaError;
        
        await supabaseService.eliminarReservaPendiente(reservaPendiente.id);
        
        showToast('✅ Reserva y pago completados', 'success');
        cargarReservas();
        
      } catch (error) {
        console.error('Error:', error);
        showToast('Error al procesar el pago', 'danger');
      }
    });
  }

  // Eventos para cancelar reservas de BD
  document.querySelectorAll('.cancelar-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      if (!id) return;
      
      const res = await cancelarReserva(id);
      if (res.ok) {
        showToast('Reserva cancelada', 'warning');
        cargarReservas();
      } else {
        showToast('Error al cancelar', 'danger');
      }
    });
  });

  // Eventos para pagar reservas de BD
  document.querySelectorAll('.pagar-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      const monto = parseFloat(e.target.dataset.monto);
      
      if (!id) return;
      
      try {
        const { error: pagoError } = await supabase
          .from('pagos')
          .insert([{
            reserva_id: id,
            monto: monto,
            metodo: 'tarjeta',
            estado: 'completado'
          }]);
        
        if (pagoError) throw pagoError;
        
        const { error: reservaError } = await supabase
          .from('reservas')
          .update({ estado: 'pagada' })
          .eq('id', id);
        
        if (reservaError) throw reservaError;
        
        showToast('✅ Pago realizado', 'success');
        cargarReservas();
        
      } catch (error) {
        console.error('Error:', error);
        showToast('Error al pagar', 'danger');
      }
    });
  });
}

document.getElementById('cerrarSesion').onclick = () => { 
  location.href = 'index.html';
};

cargarReservas();
</script>
</body>
</html>
